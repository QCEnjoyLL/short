<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="asset/img/favicon.png"  >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>short</title>
    <style>
      :root {
        --color-primary: #5c7cfa;
        --color-primary-dark: #4263eb;
        --color-primary-alpha: #5c7cfa50;

        --body-color: #495057;
        --body-bg: #f8f9fa;

        --border-color: #dee2e6;
      }

      body {
        max-width: 30rem;
        margin-left: auto;
        margin-right: auto;
        padding-left: 2rem;
        padding-right: 2rem;
        color: var(--body-color);
        background: var(--body-bg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        text-rendering: optimizelegibility;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--color-primary);
        text-decoration: none;
        transition: color .3s;
      }

      a:hover {
        color: var(--color-primary);
        text-decoration: underline;
      }

      h1 {
        font-size: 5rem;
        font-weight: 300;
        text-align: center;
        opacity: .2;
      }

      main[x-cloak] {
        opacity: 0;
      }

      main:not([x-cloak]) {
        opacity: 1;
        transition: opacity .3s;
      }

      input {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        padding: .5rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: .25rem;
        box-sizing: border-box;
        color: #33404d;
        line-height: inherit;
        font-size: 1rem;
        transition: border .3s, box-shadow .3s;
      }

      input:focus {
        box-shadow: 0 0 0 .25rem var(--color-primary-alpha);
        border-color: var(--color-primary);
        outline: 0;
      }

      details {
        margin: 1rem 0 2rem;
        border: 1px solid var(--border-color);
        border-radius: .25rem;
        transition: background .3s;
      }

      details[open] {
        background: #fff;
      }

      details summary {
        padding: .5rem 1rem;
        font-weight: 500;
        user-select: none;
        cursor: pointer;
        opacity: .8;
        outline: 0;
      }

      details div {
        padding: 1rem;
        border-top: 1px solid var(--border-color);
      }

      details small {
        margin: 0;
        font-size: .875rem;
        line-height: 2;
      }

      button {
        appearance: none;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-bottom: 5rem;
        padding: .5rem .75rem;
        border: 1px solid var(--color-primary);
        border-radius: .25rem;
        background: var(--color-primary);
        color: #fff;
        font-size: 1rem;
        font-weight: 500;
        line-height: inherit;
        cursor: pointer;
        user-select: none;
        transition: border .3s, background .3s;
      }

      button:hover {
        border-color: var(--color-primary-dark);
        background: var(--color-primary-dark);
      }

      button:focus {
        box-shadow: 0 0 0 .25rem var(--color-primary-alpha);
        border-color: var(--color-primary);
        outline: 0;
      }

      button:disabled {
        background: var(--color-primary);
        border-color: var(--color-primary);
        opacity: .6;
        cursor: not-allowed;
      }

      button.loading::before {
        content: '';
        display: inline-block;
        margin-right: .5rem;
        border: 2px solid #fff;
        border-top-color: transparent;
        border-bottom-color: transparent;
        border-radius: 50%;
        width: .75rem;
        height: .75rem;
        animation: rotate .5s linear infinite;
      }

      footer {
        padding: 1rem;
        border-top: 1px solid var(--border-color);
        text-align: center;
        opacity: .5;
      }

      footer i {
        font-style: normal;
        color: #ff8787;
      }

      .success,
      .error {
        margin-bottom: 1rem;
        padding: .5rem 1rem;
        border-radius: .25rem;
        color: #fff;
        text-align: center;
        opacity: 1;
        transition: opacity .3s;
      }

      .success {
        border: 1px solid #12b886;
        background: #38d9a9;
      }

      .error {
        border: 1px solid #fa5252;
        background: #ff8787;
      }

      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header><h1>short</h1></header>
    <main x-data="app" x-cloak>
      <p role="status" aria-live="polite" x-show.transition.opacity="alert" :class="alert?.type" x-text="alert?.message"></p>
      <input aria-label="要缩短的网址" placeholder="输入要缩短的网址..." x-model="url" x-ref="url" maxlength="8192" @keydown.enter.prevent="submit($refs, $nextTick)" />
      <details x-ref="settings">
        <summary>自定义设置</summary>
        <div>
          <input aria-label="自定义短链后缀" placeholder="slug（可选）" x-model="slug" maxlength="32" @keydown.enter.prevent="submit($refs, $nextTick)" />
          <small>默认随机生成；自定义支持 2–32 位字母、数字、下划线和短横线。</small>
          <input aria-label="创建密码" placeholder="创建密码（启用密码时填写）" type="password" autocomplete="current-password" x-model="token" x-ref="token" maxlength="1024" @keydown.enter.prevent="submit($refs, $nextTick)" />
          <small>公开创建模式可留空；启用密码时填写。访问短链不需要密码，密码不保存到浏览器存储。</small>
        </div>
      </details>
      <p x-show="result"><input aria-label="生成的短链接，点击选中" :value="result" x-ref="result" readonly @click="$el.select()" /></p>
      <button type="button" :class="{ loading }" :disabled="loading || isValidated()" @click="submit($refs, $nextTick)">生成</button>
    </main>
    <footer>
     service
    </footer>
    <script src="asset/js/alpine.js"></script>
    <script>
      const app = {
        url: '',
        slug: '',
        token: '',
        result: '',
        alert: null,
        loading: false,
        isValidated () {
          try {
            const target = new URL(this.url.trim())
            return !['http:', 'https:'].includes(target.protocol) || !target.hostname || !!target.username || !!target.password
          } catch {
            return true
          }
        },
        async submit ($refs, $nextTick) {
          if (this.loading) return
          if (this.isValidated()) {
            this.alert = { type: 'error', message: '请输入有效的 HTTP(S) 网址。' }
            return
          }
          this.alert = null
          this.result = ''
          this.loading = true

          const body = { url: this.url.trim() }
          if (this.slug.trim()) body.slug = this.slug.trim()
          const headers = { 'Content-Type': 'application/json' }
          if (this.token) headers.Authorization = `Bearer ${this.token}`

          try {
            const response = await fetch('/create', {
              method: 'POST',
              headers,
              body: JSON.stringify(body)
            })
            const data = await response.json()
            if (!response.ok || data.message) {
              const messages = {
                400: '网址或自定义后缀不合法，请检查；不能缩短本站网址。',
                401: this.token ? '创建密码不正确，请重新输入。' : '本站已启用密码，请在自定义设置中输入创建密码。',
                403: '不允许从其他网站创建短链接。',
                409: '这个短链后缀已经被使用，请换一个。',
                413: '提交内容过长，请缩短后重试。',
                503: '服务暂不可用，请检查 CREATE_TOKEN、数据库绑定及表结构。'
              }
              if (response.status === 401) {
                $refs.settings.open = true
                $refs.token.focus()
              }
              throw new Error(messages[response.status] || '生成失败，请稍后重试。')
            }
            if (typeof data.link !== 'string' || !data.link.startsWith(`${location.origin}/`)) {
              throw new Error('服务返回了无效的短链接。')
            }
            this.result = data.link
            await new Promise(resolve => $nextTick(resolve))
            $refs.result.select()
            let copied = false
            try {
              if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(data.link)
                copied = true
              } else {
                copied = document.execCommand('copy')
              }
            } catch {
              try { copied = document.execCommand('copy') } catch {}
            }
            this.alert = { type: 'success', message: copied ? '短链接已生成并复制。' : '短链接已生成，请复制下方链接。' }
          } catch (error) {
            this.alert = { type: 'error', message: error instanceof SyntaxError ? '服务响应异常，请稍后重试。' : error.message }
          } finally {
            this.loading = false
          }
        }
      }
    </script>
  </body>
</html>
